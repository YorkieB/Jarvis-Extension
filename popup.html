<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comet AI Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .action-btn {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .config-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .config-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 5px;
      opacity: 0.8;
    }

    .input-group input {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .input-group input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.15);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
    }

    .checkbox-group label {
      font-size: 13px;
      opacity: 0.9;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.9);
      color: #667eea;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .save-btn:hover {
      background: #fff;
      transform: translateY(-2px);
    }

    .status-message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    .status-message.success {
      background: rgba(40, 167, 69, 0.3);
      display: block;
    }

    .status-message.error {
      background: rgba(220, 53, 69, 0.3);
      display: block;
    }

    .footer {
      padding: 15px;
      text-align: center;
      font-size: 11px;
      opacity: 0.7;
      background: rgba(0, 0, 0, 0.2);
    }

    .shortcut-info {
      margin-top: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      font-size: 12px;
    }

    .shortcut-info strong {
      display: block;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌟 Comet</h1>
    <p>AI-Powered Browser Assistant</p>
  </div>

  <div class="content">
    <button class="action-btn" id="toggle-sidecar">
      <span>📱</span>
      <span>Toggle Sidecar</span>
    </button>

    <button class="action-btn" id="get-accessibility-tree">
      <span>🌳</span>
      <span>View Accessibility Tree</span>
    </button>

    <button class="action-btn" id="get-interactive-elements">
      <span>🎯</span>
      <span>List Interactive Elements</span>
    </button>

    <div class="shortcut-info">
      <strong>Keyboard Shortcut:</strong>
      Press <code>Ctrl+Shift+Space</code> to toggle sidecar
    </div>

    <div class="config-section">
      <div class="config-title">⚙️ Configuration</div>
      
      <div class="input-group">
        <label for="api-endpoint">API Endpoint</label>
        <input type="text" id="api-endpoint" placeholder="http://localhost:8000/api">
      </div>

      <div class="input-group">
        <label for="api-key">API Key</label>
        <input type="password" id="api-key" placeholder="Enter your API key">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="use-local-first" checked>
        <label for="use-local-first">Use local inference first</label>
      </div>

      <button class="save-btn" id="save-config">Save Configuration</button>
      
      <div class="status-message" id="status-message"></div>
    </div>
  </div>

  <div class="footer">
    Comet v1.0.0 - Accessibility Tree Perception & Hybrid Inference
  </div>

  <script src="popup.js"></script>
</body>
</html>
